<style>:root{--red:#CC0000;--dark:#1A1A1A;--navy:#1A3A5C;--white:#FFFFFF;--g50:#F5F5F4;--g100:#E8E7E4;--g200:#D1D0CE;--g400:#999;--g500:#6B6A68;--g700:#3A3A38;--green:#0F6E56;--green-bg:#E1F5EE;--green-bd:#1D9E75;--amber:#854F0B;--amber-bg:#FAEEDA;--amber-bd:#BA7517;--red-bg:#FCEBEB;--blue:#185FA5;--blue-bg:#E6F1FB;--blue-bd:#4A90D9;--purple:#534AB7;--font:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;--r:10px;--r-sm:6px;}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#EDECEB;font-family:var(--font);font-size:14px;color:var(--dark)}.app{display:flex;flex-direction:column;height:100vh;max-width:1024px;margin:0 auto;background:var(--white);box-shadow:0 0 30px rgba(0,0,0,0.12)}.screen{display:none;flex-direction:column;height:100vh;max-width:1024px;margin:0 auto;background:var(--white);box-shadow:0 0 30px rgba(0,0,0,0.12)}.screen.active{display:flex}/* Header */ .hdr{color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.hdr.pi{background:var(--red)}.hdr.ro{background:var(--navy)}.hdr.tech-ro{background:#2C4A1A}.hdr-logo{font-size:17px;font-weight:700;letter-spacing:2px;margin-right:12px}.hdr-title{font-size:13px;opacity:0.9}.hdr-sub{font-size:11px;opacity:0.65;margin-top:1px}.hdr-meta{text-align:right;font-size:11px;opacity:0.85;line-height:1.7}.hdr-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.2);margin-left:6px}/* Tabs */ .tabs{display:flex;background:var(--g50);border-bottom:1px solid var(--g100);flex-shrink:0;overflow-x:auto}.tabs::-webkit-scrollbar{display:none}.tab{padding:10px 14px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;color:var(--g500);white-space:nowrap;user-select:none;display:flex;align-items:center;gap:5px}.tab.active{color:var(--red);border-bottom-color:var(--red);background:var(--white)}.tab.active.ro{color:var(--navy);border-bottom-color:var(--navy)}.tab.active.tech{color:#2C4A1A;border-bottom-color:#2C4A1A}.tab.done{color:var(--green)}.tab-num{width:20px;height:20px;border-radius:4px;background:var(--g200);color:var(--g700);font-size:10px;text-align:center;line-height:20px;flex-shrink:0;font-weight:700}.tab.active .tab-num{background:var(--red);color:#fff}.tab.active.ro .tab-num{background:var(--navy);color:#fff}.tab.active.tech .tab-num{background:#2C4A1A;color:#fff}.tab.done .tab-num{background:var(--green);color:#fff}.tab.readonly{opacity:0.55}.tab.readonly .tab-num{background:var(--g400)}/* Content */ .content{flex:1;overflow-y:auto;padding:12px;background:var(--g50)}.panel{display:none}.panel.active{display:block}/* Cards */ .card{background:var(--white);border:0.5px solid var(--g100);border-radius:var(--r);overflow:hidden;margin-bottom:10px}.card-hdr{padding:9px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}.card-hdr.red{background:var(--red);color:#fff}.card-hdr.dark{background:var(--dark);color:#fff}.card-hdr.blue{background:var(--blue);color:#fff}.card-hdr.navy{background:var(--navy);color:#fff}.card-hdr.green{background:var(--green);color:#fff}.card-hdr.amber{background:var(--amber);color:#fff}.card-hdr.forest{background:#2C4A1A;color:#fff}.card-body{padding:12px 14px}/* Grid */ .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:flex;flex-direction:column;gap:3px}.field label{font-size:11px;color:var(--g500);font-weight:500}.field input,.field select{height:36px;padding:0 10px;border:0.5px solid var(--g200);border-radius:var(--r-sm);font-size:12px;color:var(--dark);background:var(--g50);width:100%}.field input.auto{background:#EEF6FF;border-color:#AAC9F0;color:var(--blue)}.field input:focus{outline:none;border-color:var(--navy);background:#fff}.field textarea{padding:8px 10px;border:0.5px solid var(--g200);border-radius:var(--r-sm);font-size:12px;color:var(--dark);background:var(--g50);resize:none;width:100%}.field textarea.auto{background:#EEF6FF;border-color:#AAC9F0;color:var(--navy)}.auto-tag{display:inline-block;font-size:9px;padding:1px 5px;background:#AAC9F0;color:var(--navy);border-radius:3px;margin-left:4px;font-weight:600}/* Dots / Moto */ .moto-wrap{position:relative;background:var(--g50);border-radius:8px;overflow:hidden;margin-bottom:8px;border:0.5px solid var(--g100)}.moto-lbl{font-size:11px;color:var(--g500);margin-bottom:4px;font-weight:500}.dot{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.85);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transform:translate(-50%,-50%);z-index:10}.dot.ok{background:var(--green-bd)}.dot.warn{background:var(--amber-bd)}.dot.bad{background:var(--red);animation:blink 1.8s infinite}.dot.empty{background:rgba(120,120,120,0.35)}@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(204,0,0,0.45)}60%{box-shadow:0 0 0 7px rgba(204,0,0,0)}}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--g500)}.leg-dot{width:10px;height:10px;border-radius:50%}/* Check */ .chk-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--g100)}.chk-row:last-child{border-bottom:none}.chk-label{flex:1;font-size:12px}.chk-btns{display:flex;gap:4px}.cbtn{min-width:46px;height:32px;padding:0 10px;border-radius:var(--r-sm);border:0.5px solid var(--g200);font-size:11px;cursor:pointer;background:#fff;color:var(--g500);font-weight:500}.cbtn.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.cbtn.warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}.cbtn.bad{background:var(--red-bg);color:var(--red);border-color:var(--red)}/* Purpose */ .purpose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.pchk{padding:10px 8px;border:0.5px solid var(--g200);border-radius:var(--r-sm);cursor:pointer;font-size:12px;text-align:center;background:#fff;user-select:none;line-height:1.5}.pchk.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:500}.pchk.sel-warn{border-color:var(--amber-bd);background:var(--amber-bg);color:var(--amber);font-weight:500}/* Ask */ .ask-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--g100)}.ask-row:last-child{border-bottom:none}.ask-q{flex:1;font-size:12px}.ask-btns{display:flex;gap:4px}.abtn{height:30px;padding:0 12px;border-radius:var(--r-sm);border:0.5px solid var(--g200);font-size:11px;cursor:pointer;background:#fff;color:var(--g500)}.abtn.yes{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.abtn.no{background:var(--red-bg);color:var(--red);border-color:var(--red)}.abtn.na{background:var(--g50);color:var(--g500)}/* Tech rows */ .tech-sec-hdr{padding:6px 10px;font-size:11px;font-weight:700;color:#fff;border-radius:var(--r-sm);margin-bottom:4px;margin-top:10px}.cat-engine{background:#854F0B}.cat-brake{background:#CC0000}.cat-tire{background:#185FA5}.cat-elec{background:#534AB7}.cat-chassis{background:#2C2C2C}.tech-row{display:flex;align-items:flex-start;gap:8px;padding:8px;border:0.5px solid var(--g100);border-radius:var(--r-sm);margin-bottom:4px;background:#fff}.tech-left{flex:1}.tech-title{font-size:12px;font-weight:500;margin-bottom:2px}.tech-diag{font-size:11px;color:var(--g500)}.tech-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}.saf-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}.saf-1{background:var(--red-bg);color:var(--red)}.saf-2{background:var(--amber-bg);color:var(--amber)}.saf-3{background:var(--green-bg);color:var(--green)}.dec-btns{display:flex;gap:3px}.dbtn{height:26px;padding:0 9px;border-radius:4px;border:0.5px solid var(--g200);font-size:10px;cursor:pointer;background:#fff;color:var(--g500)}.dbtn.agree{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.dbtn.defer{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}.dbtn.reject{background:var(--red-bg);color:var(--red);border-color:var(--red)}/* Quote */ .qsec-title{font-size:12px;font-weight:600;color:var(--g500);margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--g100);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.q-hdr{display:grid;gap:5px;padding:6px 8px;background:var(--dark);border-radius:var(--r-sm) var(--r-sm) 0 0;font-size:11px;font-weight:600;color:#fff}.q-hdr-sa{grid-template-columns:1fr 50px 75px 75px 75px 60px}.q-hdr-tech{grid-template-columns:1fr 50px 75px 75px 80px}.q-row{display:grid;gap:5px;padding:7px 8px;font-size:12px;border-bottom:0.5px solid var(--g100);align-items:center}.q-row-sa{grid-template-columns:1fr 50px 75px 75px 75px 60px}.q-row-tech{grid-template-columns:1fr 50px 75px 75px 80px}.q-row:nth-child(odd){background:var(--g50)}.q-row.tech-agreed{background:var(--green-bg)}.q-row.tech-defer{background:var(--amber-bg)}.q-row.tech-reject{opacity:0.45;text-decoration:line-through}.q-row.deleted{background:#FFF0F0;opacity:0.7;text-decoration:line-through}.qc{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.qc.r{text-align:right}.qc.c{text-align:center}.add-row{display:flex;gap:6px;margin-top:8px;padding:8px;border:1px dashed var(--g200);border-radius:6px;background:#fff;align-items:center;flex-wrap:wrap}.add-row input{flex:1;min-width:80px;height:32px;padding:0 8px;border:0.5px solid var(--g200);border-radius:4px;font-size:12px;background:var(--g50)}.add-row input.sm{flex:none;width:60px}.add-row button{height:32px;padding:0 12px;border:none;border-radius:4px;background:var(--blue);color:#fff;font-size:12px;cursor:pointer}/* Total */ .total-bar{background:var(--dark);border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:10px}.t-items{display:flex;gap:20px;flex-wrap:wrap}.t-item label{font-size:10px;color:rgba(255,255,255,0.6);display:block;margin-bottom:2px}.t-item span{font-size:13px;font-weight:600;color:#fff}.t-main label{font-size:11px;color:rgba(255,255,255,0.7);display:block;text-align:right}.t-main span{font-size:22px;font-weight:700;color:#FF6B6B}/* Deleted items */ .deleted-section{background:var(--red-bg);border:0.5px solid #F09595;border-radius:8px;padding:10px 14px;margin-top:8px}.deleted-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid #F09595}.deleted-item:last-child{border-bottom:none}.deleted-item-name{flex:1;font-size:12px;text-decoration:line-through;color:var(--g500)}.deleted-reason{font-size:11px;color:var(--red);margin-top:2px}.reason-input{width:100%;height:30px;padding:0 8px;border:0.5px solid #F09595;border-radius:4px;font-size:11px;background:#fff;color:var(--dark);margin-top:4px}/* Sig */ .sig-box{border:1.5px dashed var(--g200);border-radius:8px;height:78px;display:flex;align-items:center;justify-content:center;color:var(--g400);font-size:12px;cursor:pointer;background:var(--g50);margin-top:8px}.sig-box.signed{background:#fff;border-style:solid;border-color:var(--green-bd)}.sig-box.signed-navy{background:#fff;border-style:solid;border-color:var(--navy)}/* Loop hint */ .loop-hint{background:var(--red-bg);border:0.5px solid #F09595;border-radius:6px;padding:9px 12px;font-size:11px;color:var(--red);line-height:1.7;margin-top:8px}/* Transfer overlay */ .transfer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:100;display:none;align-items:center;justify-content:center}.transfer-overlay.open{display:flex}.transfer-card{background:#fff;border-radius:16px;padding:28px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}.transfer-title{font-size:18px;font-weight:700;margin-bottom:8px}.transfer-sub{font-size:13px;color:var(--g500);margin-bottom:20px;line-height:1.6}.transfer-items{background:var(--g50);border-radius:8px;padding:12px;margin-bottom:20px}.transfer-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:0.5px solid var(--g100)}.transfer-item:last-child{border-bottom:none;font-weight:600;padding-top:8px}.transfer-item span:first-child{color:var(--g500)}.transfer-btns{display:flex;gap:8px}/* RO table */ .ro-tbl{width:100%;border-collapse:collapse;font-size:12px}.ro-tbl th{background:var(--dark);color:#fff;padding:6px 8px;text-align:left;font-size:11px;white-space:nowrap}.ro-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--g100);vertical-align:middle;white-space:nowrap}.ro-tbl tr:nth-child(even) td{background:var(--g50)}.ro-tbl tr.auto-row td{background:#EEF6FF}.ro-tbl tr.tech-row td{background:var(--green-bg)}.ro-tbl tfoot td{background:var(--dark);color:#fff;padding:8px;font-weight:600}.ro-status{background:var(--blue-bg);border:0.5px solid #AAC9F0;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--blue);display:flex;align-items:center;gap:8px}.readonly-bar{background:var(--amber-bg);border:0.5px solid var(--amber-bd);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#412402;display:flex;align-items:center;gap:8px}/* 領料單 */ .parts-issue-row{display:grid;grid-template-columns:60px 1fr 80px 60px 80px 80px 80px;gap:6px;padding:7px 8px;border-bottom:0.5px solid var(--g100);align-items:center;font-size:12px}.parts-issue-row.hdr{background:var(--dark);color:#fff;font-size:11px;font-weight:600;border-radius:var(--r-sm) var(--r-sm) 0 0;border-bottom:none}.parts-issue-row:nth-child(even){background:var(--g50)}.parts-status-badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;text-align:center}.ps-pending{background:var(--amber-bg);color:var(--amber)}.ps-issued{background:var(--green-bg);color:var(--green)}.ps-missing{background:var(--red-bg);color:var(--red)}/* Sig dual */ .sig-dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.sig-block{border:0.5px solid var(--g100);border-radius:8px;padding:12px;background:var(--white)}.sig-block-title{font-size:11px;font-weight:600;color:var(--g500);margin-bottom:6px}/* Progress & footer */ .prog-wrap{padding:7px 14px;background:#fff;border-top:0.5px solid var(--g100);display:flex;align-items:center;gap:10px;flex-shrink:0}.prog-bar{flex:1;height:3px;background:var(--g200);border-radius:2px;overflow:hidden}.prog-fill{height:100%;border-radius:2px;transition:width 0.35s}.prog-fill.pi{background:var(--red)}.prog-fill.ro{background:var(--navy)}.prog-fill.tech{background:#2C4A1A}.prog-text{font-size:11px;color:var(--g500);white-space:nowrap}.footer{padding:10px 14px;background:#fff;border-top:0.5px solid var(--g100);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.btn{height:40px;padding:0 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s}.btn:active{transform:scale(0.97)}.btn-red{background:var(--red);color:#fff}.btn-navy{background:var(--navy);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-forest{background:#2C4A1A;color:#fff}.btn-outline{background:transparent;border:0.5px solid var(--g200);color:var(--dark)}.btn-group{display:flex;gap:8px;align-items:center}.btn-ghost{background:rgba(255,255,255,0.15);color:#fff;border:0.5px solid rgba(255,255,255,0.3);height:32px;padding:0 12px;border-radius:6px;font-size:12px;cursor:pointer}.hint{font-size:11px;color:var(--g500)}.divider{height:0.5px;background:var(--g100);margin:12px 0}.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;color:#fff;margin-right:4px}.tag-sa{background:var(--blue)}.tag-tech{background:var(--amber)}.tag-auto{background:var(--navy)}.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}.badge-ok{background:var(--green-bg);color:var(--green)}.badge-warn{background:var(--amber-bg);color:var(--amber)}.badge-bad{background:var(--red-bg);color:var(--red)}.badge-gray{background:var(--g100);color:var(--g500)}.alert{border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.7;margin-bottom:10px}.alert.amber{background:var(--amber-bg);border:0.5px solid var(--amber-bd);color:#412402}.alert.blue{background:var(--blue-bg);border:0.5px solid var(--blue-bd);color:#0D3166}.alert.red{background:var(--red-bg);border:0.5px solid #F09595;color:#7A1A1A}.alert.green{background:var(--green-bg);border:0.5px solid var(--green-bd);color:var(--green)}/* View switcher */ .view-switcher{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--dark);border-bottom:0.5px solid rgba(255,255,255,0.1);flex-shrink:0}.view-switcher span{font-size:11px;color:rgba(255,255,255,0.5)}.view-btn{padding:5px 14px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.3);font-size:11px;font-weight:500;cursor:pointer;color:rgba(255,255,255,0.6);background:transparent;transition:all 0.15s}.view-btn.active-sa{background:var(--navy);color:#fff;border-color:var(--navy)}.view-btn.active-tech{background:#2C4A1A;color:#fff;border-color:#2C4A1A}.ctag-wrap{margin-top:14px;border:1px solid #C4BEF0;border-radius:8px;overflow:hidden;background:#fff;width:100%;}.ctag-bar{padding:8px 14px;background:#F0EFFE;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}.ctag-bar-left{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#26215C;flex:1;min-width:0;}.ctag-bar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}.ctag-toggle-btn{font-size:11px;padding:2px 9px;border-radius:5px;background:#534AB7;color:#fff;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;}.ctag-role-badge{font-size:10px;padding:1px 7px;border-radius:5px;background:#E8E4FB;color:#534AB7;font-weight:500;}.ctag-summary{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1;min-width:0;overflow:hidden;}.ctag-body{padding:12px 14px;border-top:1px solid #E0D9F7;}.ctag-legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;background:#FAF9F7;border-radius:6px;border:1px solid #EEECE6;margin-bottom:10px;font-size:10.5px;color:#888;}.ctag-legend span{display:flex;align-items:center;gap:3px;}.ctag-sw{width:9px;height:9px;border-radius:2px;display:inline-block;}.ctag-section-lbl{font-size:10.5px;color:#999;font-weight:500;letter-spacing:.3px;margin-bottom:6px;margin-top:8px;}.ctag-section-lbl:first-child{margin-top:0;}.ctag-row{display:flex;flex-wrap:wrap;gap:5px;min-height:26px;}.ctag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 8px;border-radius:16px;font-size:11.5px;font-weight:500;white-space:nowrap;}.ctag-red{background:#FDECEA;border:1px solid #F5AEAD;color:#7A1010;}.ctag-yellow{background:#FDF3E3;border:1px solid #F0C97E;color:#6B3A00;}.ctag-green{background:#E5F5EE;border:1px solid #80CCA8;color:#084D30;}.ctag-blue{background:#EAF4FB;border:1px solid #85B7EB;color:#0C3E70;}.ctag-src{font-size:10px;opacity:.6;}.ctag-lock{font-size:10px;opacity:.45;}.ctag-del{background:none;border:none;cursor:pointer;font-size:12px;color:#aaa;padding:0 0 0 2px;line-height:1;}.ctag-del:hover{color:#CC0000;}.preset-row{display:flex;flex-wrap:wrap;gap:5px;}.preset-tag{border-radius:14px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:opacity .1s;}.preset-tag:hover{opacity:.7;}.preset-red{background:#FDECEA;color:#7A1010;border:1px solid #F5AEAD;}.preset-yellow{background:#FDF3E3;color:#6B3A00;border:1px solid #F0C97E;}.preset-green{background:#E5F5EE;color:#084D30;border:1px solid #80CCA8;}.preset-blue{background:#EAF4FB;color:#0C3E70;border:1px solid #85B7EB;}.ctag-add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;}.ctag-add-row select,.ctag-add-row input{height:30px;border:1px solid #D1D0CE;border-radius:5px;padding:0 8px;font-size:12px;font-family:inherit;background:#fff;}.ctag-add-row input{flex:1;min-width:130px;}.ctag-add-btn{height:30px;padding:0 13px;background:#534AB7;color:#fff;border:none;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;}.ctag-hint{font-size:10.5px;color:#aaa;margin-top:4px;}.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}.kpi{background:var(--white);border:1px solid var(--g100);border-radius:var(--r);padding:12px 14px;}.kpi-n{font-size:22px;font-weight:700;margin:4px 0;}.kpi-l{font-size:11px;color:var(--g400);}.tw{background:var(--white);border:1px solid var(--g100);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}.ts{overflow-x:auto;}table{width:100%;border-collapse:collapse;}thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g100);white-space:nowrap;}tbody tr{border-bottom:1px solid var(--g100);}tbody tr:last-child{border-bottom:none;}tbody tr:hover td{background:var(--g50);}tbody td{padding:8px 12px;font-size:12.5px;}.td-mono{font-family:monospace;font-size:12px;}.td-c{text-align:center;}.card-blk{background:var(--white);border:1px solid var(--g100);border-radius:var(--r);margin-bottom:14px;}.card-blk-hdr{padding:10px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;}.qbar{background:var(--white);border:1px solid var(--g100);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}.qf{display:flex;flex-direction:column;gap:3px;}.qf label{font-size:11px;color:var(--g400);font-weight:500;}.qf select,.qf input{height:30px;border:1px solid var(--g200);border-radius:5px;padding:0 9px;font-size:12.5px;color:var(--dark);background:var(--white);font-family:var(--font);outline:none;}.badge2{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;}.b2-green{background:var(--green-bg);color:var(--green);}.b2-amber{background:var(--amber-bg);color:var(--amber);}.b2-red{background:var(--red-bg);color:var(--red);}.b2-blue{background:var(--blue-bg);color:var(--blue);}.b2-gray{background:var(--g100);color:var(--g500);}.b2-navy{background:#E8EFF8;color:var(--navy);}.b2-purple{background:#EEEDFE;color:#534AB7;}.btn2{padding:0 14px;height:30px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:var(--font);font-weight:500;border:none;transition:all .12s;}.btn2-navy{background:var(--navy);color:#fff;}.btn2-navy:hover{background:#0F2A45;}.btn2-ghost{background:var(--white);color:var(--g500);border:1px solid var(--g200);}.btn2-ghost:hover{border-color:var(--g400);}.btn2-red{background:var(--red-bg);color:var(--red);border:1px solid #F5AEAD;}.btn2-green{background:var(--green);color:#fff;}.btn2-sm{padding:0 10px;height:26px;font-size:11.5px;}.ff{display:flex;flex-direction:column;gap:4px;}.ff label{font-size:11px;color:var(--g400);font-weight:500;}.ff input,.ff select{height:32px;border:1px solid var(--g200);border-radius:5px;padding:0 10px;font-size:12.5px;color:var(--dark);background:var(--white);font-family:var(--font);outline:none;}.sec-title{font-size:12px;font-weight:600;color:var(--navy);letter-spacing:.3px;margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--navy);display:flex;align-items:center;gap:6px;}
/* 庫存狀態顏色 */
.stock-ok{color:#0F6E56;font-weight:600;font-size:11.5px;}
.stock-low{color:#854F0B;font-weight:600;font-size:11.5px;}
.stock-out{color:#C8001A;font-weight:600;font-size:11.5px;}
.cross-store-btn{padding:3px 9px;border-radius:5px;background:#FDF3E3;color:#854F0B;border:1px solid #F0C97E;font-size:11px;cursor:pointer;font-family:sans-serif;}

<body>
<div style="position:fixed;top:10px;left:10px;z-index:8888;display:flex;gap:8px;"><button onclick="go('02_正式工單RO.html')" style="padding:5px 14px;background:#1A3A5C;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:sans-serif;">← RO工單</button><button onclick="go('04_追加項目記錄.html')" style="padding:5px 14px;background:#C8001A;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:sans-serif;">追加記錄 →</button></div>
<header style="background:var(--navy);height:48px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2);">
<span style="font-size:17px;font-weight:700;letter-spacing:2px;color:#fff;">DUCATI</span>
<span style="width:1px;height:20px;background:rgba(255,255,255,0.2);display:inline-block;"></span>
<span style="font-size:13px;color:rgba(255,255,255,0.6);">售後工單模組 <b style="color:#fff;font-weight:500;">維修項目／零件明細</b></span>
<span style="margin-left:auto;font-size:12px;color:rgba(255,255,255,0.55);">SA：魏呈宇　2026/05/08　　<span style="font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);">台北直營店</span></span>
</header>
<div style="max-width:1080px;margin:0 auto;padding:18px 20px;">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
  <div>
    <div style="font-size:11px;color:var(--g400);">工單號</div>
    <div style="font-size:18px;font-weight:700;font-family:monospace;color:var(--navy);">MN-CP-260508-003</div>
  </div>
  <div style="font-size:12.5px;color:var(--g500);">鄭宗勳・PANIGALE V2・LGX-8096・進廠里程：12,850 km</div>
  <div style="display:flex;gap:8px;">
    <button class="btn2 btn2-ghost" onclick="showToast("返回RO工單")">← 返回工單</button>
    <button class="btn2 btn2-navy" onclick="showToast("儲存明細")">儲存明細</button>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 340px;gap:14px;">
  <!-- 左：工項與零件明細 -->
  <div>
    <div class="sec-title">🔧 工項明細 <button class="btn2 btn2-navy btn2-sm" onclick="addItem()">＋ 新增工項</button></div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>工項名稱</th><th>工時(LU)</th><th>工時費</th><th>備註</th><th>操作</th></tr></thead>
      <tbody id="labor-body"></tbody>
      <tfoot><tr style="background:var(--g50);"><td colspan="2" style="padding:8px 12px;font-size:12px;font-weight:600;">工時小計</td><td class="td-c" style="font-weight:600;" id="labor-lu-total">3.5 LU</td><td style="font-weight:600;color:var(--navy);" id="labor-fee-total">NT$3,600</td><td colspan="2"></td></tr></tfoot>
    </table></div>

    <div class="sec-title">🔩 零件明細 <button class="btn2 btn2-navy btn2-sm" onclick="addPart()">＋ 新增零件</button></div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>料號</th><th>品名</th><th>數量</th><th>單價</th><th>庫存狀態</th><th>小計</th><th>庫存</th><th>操作</th></tr></thead>
      <tbody id="parts-body"></tbody>
      <tfoot><tr style="background:var(--g50);"><td colspan="5" style="padding:8px 12px;font-size:12px;font-weight:600;">零件小計</td><td style="padding:8px 12px;font-weight:600;color:var(--navy);" id="parts-total">NT$4,200</td><td colspan="2"></td></tr></tfoot>
    </table></div>
  </div>

  <!-- 右：費用彙總 -->
  <div>
    <div class="card-blk">
      <div class="card-blk-hdr">💰 費用彙總</div>
      <div style="padding:14px;">
        <div style="display:flex;flex-direction:column;gap:8px;" id="cost-summary"></div>
        <div style="border-top:2px solid var(--navy);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:600;">總計（含稅5%）</span>
          <span style="font-size:18px;font-weight:700;color:var(--navy);" id="grand-total">NT$8,190</span>
        </div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
          <div class="ff"><label>折扣（%）</label><input type="number" value="0" min="0" max="30" onchange="calcDiscount(this.value)"></div>
          <div class="ff"><label>折扣原因</label><select><option>無折扣</option><option>VIP客戶</option><option>促銷活動</option><option>主管授權</option></select></div>
        </div>
      </div>
    </div>
    <div class="card-blk">
      <div class="card-blk-hdr">⚡ 庫存提示</div>
      <div style="padding:10px 14px;display:flex;flex-direction:column;gap:6px;" id="stock-hints"></div>
    </div>
  </div>
</div>

</div>
<script>
var labors=[
  {n:1,name:'Desmo 12,000km 定期保養',lu:2.5,fee:2500,note:'含Desmo閥清潔'},
  {n:2,name:'前煞車皮（左右）安裝工資',lu:0.5,fee:600,note:''},
  {n:3,name:'鏈條張力調整',lu:0.5,fee:500,note:''},
];
var parts=[
  {n:1,pn:'67620871B',name:'機油濾芯 Panigale V2',qty:1,price:380,stock:'✅ 庫存:8'},
  {n:2,pn:'24611461B',name:'Desmo 保養套件（12,000km）',qty:1,price:1820,stock:'✅ 庫存:3'},
  {n:3,pn:'61810391B',name:'前煞車皮（左右一組）',qty:1,price:2000,stock:'⚠️ 庫存:1'},
];
function renderLabor(){
  var tb=document.getElementById('labor-body');
  tb.innerHTML='';
  labors.forEach(function(l){
    tb.innerHTML+='<tr><td class="td-c td-mono">'+l.n+'</td><td style="font-weight:500;">'+l.name+'</td><td class="td-c">'+l.lu+'</td><td>NT$'+l.fee.toLocaleString()+'</td><td style="font-size:11px;color:var(--g400);">'+l.note+'</td><td><button class="btn2 btn2-ghost btn2-sm" onclick="showToast("編輯")">編輯</button></td></tr>';
  });
}
function renderParts(){
  var t=document.getElementById('parts-list');
  if(!t) return;
  var stockData={'FLT-OIL-PV2':{qty:8,status:'ok'},'FLT-AIR-PV2':{qty:3,status:'low'},'BRAKE-FRT-V2':{qty:0,status:'out'}};
  t.innerHTML='';
  parts.forEach(function(p){
    var stock=stockData[p.sku]||{qty:5,status:'ok'};
    var stockHtml='';
    if(stock.status==='ok') stockHtml='<span class="stock-ok">✅ '+stock.qty+'個</span>';
    else if(stock.status==='low') stockHtml='<span class="stock-low">⚠️ '+stock.qty+'個（低量）</span>';
    else stockHtml='<span class="stock-out">❌ 缺料</span><br><button class="cross-store-btn" onclick="checkCrossStore(''+p.sku+'')">查跨店庫存</button>';
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+p.name+'</td><td style="font-family:monospace;font-size:11px;">'+p.sku+'</td><td>'+p.qty+'</td><td style="text-align:right;">NT$'+p.price.toLocaleString()+'</td><td>'+stockHtml+'</td><td style="text-align:right;">NT$'+(p.qty*p.price).toLocaleString()+'</td>';
    t.appendChild(tr);
  });
}
// original renderParts replaced
function _renderParts_REPLACED(){
  var tb=document.getElementById('parts-body');
  tb.innerHTML='';
  parts.forEach(function(p){
    var sc=p.stock.startsWith('⚠️')?'b2-amber':'b2-green';
    tb.innerHTML+='<tr><td class="td-c td-mono">'+p.n+'</td><td class="td-mono" style="font-size:11px;">'+p.pn+'</td><td style="font-weight:500;">'+p.name+'</td><td class="td-c">'+p.qty+'</td><td>NT$'+p.price.toLocaleString()+'</td><td style="font-weight:600;">NT$'+(p.qty*p.price).toLocaleString()+'</td><td><span class="badge2 '+sc+'" style="font-size:10.5px;">'+p.stock+'</span></td><td><button class="btn2 btn2-ghost btn2-sm" onclick="showToast("編輯")">編輯</button></td></tr>';
  });
}
function renderSummary(){
  var laborFee=labors.reduce(function(a,l){return a+l.fee;},0);
  var partsFee=parts.reduce(function(a,p){return a+p.qty*p.price;},0);
  var sub=laborFee+partsFee;
  var tax=Math.round(sub*0.05);
  var total=sub+tax;
  document.getElementById('cost-summary').innerHTML='<div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--g500);">工時費</span><span>NT$'+laborFee.toLocaleString()+'</span></div><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--g500);">零件費</span><span>NT$'+partsFee.toLocaleString()+'</span></div><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--g500);">稅金（5%）</span><span>NT$'+tax.toLocaleString()+'</span></div>';
  document.getElementById('grand-total').textContent='NT$'+total.toLocaleString();
  var hints=document.getElementById('stock-hints');
  hints.innerHTML='';
  parts.forEach(function(p){
    if(p.stock.startsWith('⚠️'))hints.innerHTML+='<div style="font-size:11.5px;color:var(--amber);">⚠️ '+p.name+' 庫存偏低，建議確認供貨</div>';
  });
}
function addItem(){
  // 後端串接點：GET /api/labor-rates?type=MN
  showToast('新增工項（後端串接點：GET /api/labor-rates?type=MN，07B_服務套餐與費率設定）');
}
function checkCrossStore(sku){
  // 後端串接點：GET /api/inventory?sku={sku}&all_stores=true
  showToast('查詢跨店庫存：'+sku+'\n\n台北南區店：4個（可調撥，預計明日上午到貨）\n新竹店：2個（調撥需2天）\n\n發起調撥申請？（後端：POST /api/inventory/transfer-request）');
}
function addPart(){
  // 後端串接點：GET /api/inventory?sku=XXXX
  showToast('新增零件（後端串接點：GET /api/inventory?sku=XXXX）');
}
function calcDiscount(d){
  var laborFee=labors.reduce(function(a,l){return a+l.fee;},0);
  var partsFee=parts.reduce(function(a,p){return a+p.qty*p.price;},0);
  var sub=(laborFee+partsFee)*(1-d/100);
  var total=Math.round(sub*1.05);
  document.getElementById('grand-total').textContent='NT$'+total.toLocaleString();
}
renderLabor();renderParts();renderSummary();
</script>

<style>
#_sys_toast_{position:fixed;bottom:24px;right:24px;background:#1A3A5C;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;transform:translateY(80px);opacity:0;transition:all .25s;pointer-events:none;max-width:340px;line-height:1.6;white-space:pre-line;box-shadow:0 4px 16px rgba(0,0,0,.25);}
</style>
<div id="_sys_toast_"></div>
<script>
function showToast(msg,dur){var t=document.getElementById('_sys_toast_');if(!t)return;t.textContent=msg;t.style.transform='translateY(0)';t.style.opacity='1';clearTimeout(t._tid);t._tid=setTimeout(function(){t.style.transform='translateY(80px)';t.style.opacity='0';},dur||2800);}
function go(url){window.location.href=url;}
</script>

</html>
