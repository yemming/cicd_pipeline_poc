<style>:root{--red:#CC0000;--dark:#1A1A1A;--navy:#1A3A5C;--white:#FFFFFF;--g50:#F5F5F4;--g100:#E8E7E4;--g200:#D1D0CE;--g400:#999;--g500:#6B6A68;--g700:#3A3A38;--green:#0F6E56;--green-bg:#E1F5EE;--green-bd:#1D9E75;--amber:#854F0B;--amber-bg:#FAEEDA;--amber-bd:#BA7517;--red-bg:#FCEBEB;--blue:#185FA5;--blue-bg:#E6F1FB;--blue-bd:#4A90D9;--purple:#534AB7;--font:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;--r:10px;--r-sm:6px;}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#EDECEB;font-family:var(--font);font-size:14px;color:var(--dark)}.app{display:flex;flex-direction:column;height:100vh;max-width:1024px;margin:0 auto;background:var(--white);box-shadow:0 0 30px rgba(0,0,0,0.12)}.screen{display:none;flex-direction:column;height:100vh;max-width:1024px;margin:0 auto;background:var(--white);box-shadow:0 0 30px rgba(0,0,0,0.12)}.screen.active{display:flex}/* Header */ .hdr{color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.hdr.pi{background:var(--red)}.hdr.ro{background:var(--navy)}.hdr.tech-ro{background:#2C4A1A}.hdr-logo{font-size:17px;font-weight:700;letter-spacing:2px;margin-right:12px}.hdr-title{font-size:13px;opacity:0.9}.hdr-sub{font-size:11px;opacity:0.65;margin-top:1px}.hdr-meta{text-align:right;font-size:11px;opacity:0.85;line-height:1.7}.hdr-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.2);margin-left:6px}/* Tabs */ .tabs{display:flex;background:var(--g50);border-bottom:1px solid var(--g100);flex-shrink:0;overflow-x:auto}.tabs::-webkit-scrollbar{display:none}.tab{padding:10px 14px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;color:var(--g500);white-space:nowrap;user-select:none;display:flex;align-items:center;gap:5px}.tab.active{color:var(--red);border-bottom-color:var(--red);background:var(--white)}.tab.active.ro{color:var(--navy);border-bottom-color:var(--navy)}.tab.active.tech{color:#2C4A1A;border-bottom-color:#2C4A1A}.tab.done{color:var(--green)}.tab-num{width:20px;height:20px;border-radius:4px;background:var(--g200);color:var(--g700);font-size:10px;text-align:center;line-height:20px;flex-shrink:0;font-weight:700}.tab.active .tab-num{background:var(--red);color:#fff}.tab.active.ro .tab-num{background:var(--navy);color:#fff}.tab.active.tech .tab-num{background:#2C4A1A;color:#fff}.tab.done .tab-num{background:var(--green);color:#fff}.tab.readonly{opacity:0.55}.tab.readonly .tab-num{background:var(--g400)}/* Content */ .content{flex:1;overflow-y:auto;padding:12px;background:var(--g50)}.panel{display:none}.panel.active{display:block}/* Cards */ .card{background:var(--white);border:0.5px solid var(--g100);border-radius:var(--r);overflow:hidden;margin-bottom:10px}.card-hdr{padding:9px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}.card-hdr.red{background:var(--red);color:#fff}.card-hdr.dark{background:var(--dark);color:#fff}.card-hdr.blue{background:var(--blue);color:#fff}.card-hdr.navy{background:var(--navy);color:#fff}.card-hdr.green{background:var(--green);color:#fff}.card-hdr.amber{background:var(--amber);color:#fff}.card-hdr.forest{background:#2C4A1A;color:#fff}.card-body{padding:12px 14px}/* Grid */ .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:flex;flex-direction:column;gap:3px}.field label{font-size:11px;color:var(--g500);font-weight:500}.field input,.field select{height:36px;padding:0 10px;border:0.5px solid var(--g200);border-radius:var(--r-sm);font-size:12px;color:var(--dark);background:var(--g50);width:100%}.field input.auto{background:#EEF6FF;border-color:#AAC9F0;color:var(--blue)}.field input:focus{outline:none;border-color:var(--navy);background:#fff}.field textarea{padding:8px 10px;border:0.5px solid var(--g200);border-radius:var(--r-sm);font-size:12px;color:var(--dark);background:var(--g50);resize:none;width:100%}.field textarea.auto{background:#EEF6FF;border-color:#AAC9F0;color:var(--navy)}.auto-tag{display:inline-block;font-size:9px;padding:1px 5px;background:#AAC9F0;color:var(--navy);border-radius:3px;margin-left:4px;font-weight:600}/* Dots / Moto */ .moto-wrap{position:relative;background:var(--g50);border-radius:8px;overflow:hidden;margin-bottom:8px;border:0.5px solid var(--g100)}.moto-lbl{font-size:11px;color:var(--g500);margin-bottom:4px;font-weight:500}.dot{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.85);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transform:translate(-50%,-50%);z-index:10}.dot.ok{background:var(--green-bd)}.dot.warn{background:var(--amber-bd)}.dot.bad{background:var(--red);animation:blink 1.8s infinite}.dot.empty{background:rgba(120,120,120,0.35)}@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(204,0,0,0.45)}60%{box-shadow:0 0 0 7px rgba(204,0,0,0)}}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--g500)}.leg-dot{width:10px;height:10px;border-radius:50%}/* Check */ .chk-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--g100)}.chk-row:last-child{border-bottom:none}.chk-label{flex:1;font-size:12px}.chk-btns{display:flex;gap:4px}.cbtn{min-width:46px;height:32px;padding:0 10px;border-radius:var(--r-sm);border:0.5px solid var(--g200);font-size:11px;cursor:pointer;background:#fff;color:var(--g500);font-weight:500}.cbtn.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.cbtn.warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}.cbtn.bad{background:var(--red-bg);color:var(--red);border-color:var(--red)}/* Purpose */ .purpose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.pchk{padding:10px 8px;border:0.5px solid var(--g200);border-radius:var(--r-sm);cursor:pointer;font-size:12px;text-align:center;background:#fff;user-select:none;line-height:1.5}.pchk.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:500}.pchk.sel-warn{border-color:var(--amber-bd);background:var(--amber-bg);color:var(--amber);font-weight:500}/* Ask */ .ask-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--g100)}.ask-row:last-child{border-bottom:none}.ask-q{flex:1;font-size:12px}.ask-btns{display:flex;gap:4px}.abtn{height:30px;padding:0 12px;border-radius:var(--r-sm);border:0.5px solid var(--g200);font-size:11px;cursor:pointer;background:#fff;color:var(--g500)}.abtn.yes{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.abtn.no{background:var(--red-bg);color:var(--red);border-color:var(--red)}.abtn.na{background:var(--g50);color:var(--g500)}/* Tech rows */ .tech-sec-hdr{padding:6px 10px;font-size:11px;font-weight:700;color:#fff;border-radius:var(--r-sm);margin-bottom:4px;margin-top:10px}.cat-engine{background:#854F0B}.cat-brake{background:#CC0000}.cat-tire{background:#185FA5}.cat-elec{background:#534AB7}.cat-chassis{background:#2C2C2C}.tech-row{display:flex;align-items:flex-start;gap:8px;padding:8px;border:0.5px solid var(--g100);border-radius:var(--r-sm);margin-bottom:4px;background:#fff}.tech-left{flex:1}.tech-title{font-size:12px;font-weight:500;margin-bottom:2px}.tech-diag{font-size:11px;color:var(--g500)}.tech-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}.saf-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}.saf-1{background:var(--red-bg);color:var(--red)}.saf-2{background:var(--amber-bg);color:var(--amber)}.saf-3{background:var(--green-bg);color:var(--green)}.dec-btns{display:flex;gap:3px}.dbtn{height:26px;padding:0 9px;border-radius:4px;border:0.5px solid var(--g200);font-size:10px;cursor:pointer;background:#fff;color:var(--g500)}.dbtn.agree{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}.dbtn.defer{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}.dbtn.reject{background:var(--red-bg);color:var(--red);border-color:var(--red)}/* Quote */ .qsec-title{font-size:12px;font-weight:600;color:var(--g500);margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--g100);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.q-hdr{display:grid;gap:5px;padding:6px 8px;background:var(--dark);border-radius:var(--r-sm) var(--r-sm) 0 0;font-size:11px;font-weight:600;color:#fff}.q-hdr-sa{grid-template-columns:1fr 50px 75px 75px 75px 60px}.q-hdr-tech{grid-template-columns:1fr 50px 75px 75px 80px}.q-row{display:grid;gap:5px;padding:7px 8px;font-size:12px;border-bottom:0.5px solid var(--g100);align-items:center}.q-row-sa{grid-template-columns:1fr 50px 75px 75px 75px 60px}.q-row-tech{grid-template-columns:1fr 50px 75px 75px 80px}.q-row:nth-child(odd){background:var(--g50)}.q-row.tech-agreed{background:var(--green-bg)}.q-row.tech-defer{background:var(--amber-bg)}.q-row.tech-reject{opacity:0.45;text-decoration:line-through}.q-row.deleted{background:#FFF0F0;opacity:0.7;text-decoration:line-through}.qc{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.qc.r{text-align:right}.qc.c{text-align:center}.add-row{display:flex;gap:6px;margin-top:8px;padding:8px;border:1px dashed var(--g200);border-radius:6px;background:#fff;align-items:center;flex-wrap:wrap}.add-row input{flex:1;min-width:80px;height:32px;padding:0 8px;border:0.5px solid var(--g200);border-radius:4px;font-size:12px;background:var(--g50)}.add-row input.sm{flex:none;width:60px}.add-row button{height:32px;padding:0 12px;border:none;border-radius:4px;background:var(--blue);color:#fff;font-size:12px;cursor:pointer}/* Total */ .total-bar{background:var(--dark);border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:10px}.t-items{display:flex;gap:20px;flex-wrap:wrap}.t-item label{font-size:10px;color:rgba(255,255,255,0.6);display:block;margin-bottom:2px}.t-item span{font-size:13px;font-weight:600;color:#fff}.t-main label{font-size:11px;color:rgba(255,255,255,0.7);display:block;text-align:right}.t-main span{font-size:22px;font-weight:700;color:#FF6B6B}/* Deleted items */ .deleted-section{background:var(--red-bg);border:0.5px solid #F09595;border-radius:8px;padding:10px 14px;margin-top:8px}.deleted-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid #F09595}.deleted-item:last-child{border-bottom:none}.deleted-item-name{flex:1;font-size:12px;text-decoration:line-through;color:var(--g500)}.deleted-reason{font-size:11px;color:var(--red);margin-top:2px}.reason-input{width:100%;height:30px;padding:0 8px;border:0.5px solid #F09595;border-radius:4px;font-size:11px;background:#fff;color:var(--dark);margin-top:4px}/* Sig */ .sig-box{border:1.5px dashed var(--g200);border-radius:8px;height:78px;display:flex;align-items:center;justify-content:center;color:var(--g400);font-size:12px;cursor:pointer;background:var(--g50);margin-top:8px}.sig-box.signed{background:#fff;border-style:solid;border-color:var(--green-bd)}.sig-box.signed-navy{background:#fff;border-style:solid;border-color:var(--navy)}/* Loop hint */ .loop-hint{background:var(--red-bg);border:0.5px solid #F09595;border-radius:6px;padding:9px 12px;font-size:11px;color:var(--red);line-height:1.7;margin-top:8px}/* Transfer overlay */ .transfer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:100;display:none;align-items:center;justify-content:center}.transfer-overlay.open{display:flex}.transfer-card{background:#fff;border-radius:16px;padding:28px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}.transfer-title{font-size:18px;font-weight:700;margin-bottom:8px}.transfer-sub{font-size:13px;color:var(--g500);margin-bottom:20px;line-height:1.6}.transfer-items{background:var(--g50);border-radius:8px;padding:12px;margin-bottom:20px}.transfer-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:0.5px solid var(--g100)}.transfer-item:last-child{border-bottom:none;font-weight:600;padding-top:8px}.transfer-item span:first-child{color:var(--g500)}.transfer-btns{display:flex;gap:8px}/* RO table */ .ro-tbl{width:100%;border-collapse:collapse;font-size:12px}.ro-tbl th{background:var(--dark);color:#fff;padding:6px 8px;text-align:left;font-size:11px;white-space:nowrap}.ro-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--g100);vertical-align:middle;white-space:nowrap}.ro-tbl tr:nth-child(even) td{background:var(--g50)}.ro-tbl tr.auto-row td{background:#EEF6FF}.ro-tbl tr.tech-row td{background:var(--green-bg)}.ro-tbl tfoot td{background:var(--dark);color:#fff;padding:8px;font-weight:600}.ro-status{background:var(--blue-bg);border:0.5px solid #AAC9F0;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--blue);display:flex;align-items:center;gap:8px}.readonly-bar{background:var(--amber-bg);border:0.5px solid var(--amber-bd);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#412402;display:flex;align-items:center;gap:8px}/* 領料單 */ .parts-issue-row{display:grid;grid-template-columns:60px 1fr 80px 60px 80px 80px 80px;gap:6px;padding:7px 8px;border-bottom:0.5px solid var(--g100);align-items:center;font-size:12px}.parts-issue-row.hdr{background:var(--dark);color:#fff;font-size:11px;font-weight:600;border-radius:var(--r-sm) var(--r-sm) 0 0;border-bottom:none}.parts-issue-row:nth-child(even){background:var(--g50)}.parts-status-badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;text-align:center}.ps-pending{background:var(--amber-bg);color:var(--amber)}.ps-issued{background:var(--green-bg);color:var(--green)}.ps-missing{background:var(--red-bg);color:var(--red)}/* Sig dual */ .sig-dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.sig-block{border:0.5px solid var(--g100);border-radius:8px;padding:12px;background:var(--white)}.sig-block-title{font-size:11px;font-weight:600;color:var(--g500);margin-bottom:6px}/* Progress & footer */ .prog-wrap{padding:7px 14px;background:#fff;border-top:0.5px solid var(--g100);display:flex;align-items:center;gap:10px;flex-shrink:0}.prog-bar{flex:1;height:3px;background:var(--g200);border-radius:2px;overflow:hidden}.prog-fill{height:100%;border-radius:2px;transition:width 0.35s}.prog-fill.pi{background:var(--red)}.prog-fill.ro{background:var(--navy)}.prog-fill.tech{background:#2C4A1A}.prog-text{font-size:11px;color:var(--g500);white-space:nowrap}.footer{padding:10px 14px;background:#fff;border-top:0.5px solid var(--g100);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.btn{height:40px;padding:0 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s}.btn:active{transform:scale(0.97)}.btn-red{background:var(--red);color:#fff}.btn-navy{background:var(--navy);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-forest{background:#2C4A1A;color:#fff}.btn-outline{background:transparent;border:0.5px solid var(--g200);color:var(--dark)}.btn-group{display:flex;gap:8px;align-items:center}.btn-ghost{background:rgba(255,255,255,0.15);color:#fff;border:0.5px solid rgba(255,255,255,0.3);height:32px;padding:0 12px;border-radius:6px;font-size:12px;cursor:pointer}.hint{font-size:11px;color:var(--g500)}.divider{height:0.5px;background:var(--g100);margin:12px 0}.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;color:#fff;margin-right:4px}.tag-sa{background:var(--blue)}.tag-tech{background:var(--amber)}.tag-auto{background:var(--navy)}.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}.badge-ok{background:var(--green-bg);color:var(--green)}.badge-warn{background:var( }.ctag-add-btn{height:30px;padding:0 13px;background:#534AB7;color:#fff;border:none;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;}.ctag-hint{font-size:10.5px;color:#aaa;margin-top:4px;}.tab-bar{display:flex;border-bottom:2px solid var(--g100);margin-bottom:16px;gap:0;}.tb{padding:10px 20px;font-size:13px;font-weight:500;color:var(--g400);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:var(--font);transition:all .12s;}.tb.on{color:var(--navy);border-bottom-color:var(--navy);}.tp{display:none;}.tp.on{display:block;}.card{background:var(--white);border:1px solid var(--g100);border-radius:10px;margin-bottom:14px;overflow:hidden;}.chdr{padding:11px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;}.cbody{padding:14px 16px;}.tw{background:var(--white);border:1px solid var(--g100);border-radius:10px;overflow:hidden;margin-bottom:14px;}.ts{overflow-x:auto;}table{width:100%;border-collapse:collapse;}thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g100);white-space:nowrap;}tbody tr{border-bottom:1px solid var(--g100);}tbody tr:last-child{border-bottom:none;}tbody tr:hover td{background:var(--g50);}tbody td{padding:8px 12px;font-size:12.5px;}.tdm{font-family:monospace;font-size:12px;}.tdc{text-align:center;}.b2{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;}.bgreen{background:var(--green-bg);color:var(--green);}.bamber{background:var(--amber-bg);color:var(--amber);}.bred{background:var(--red-bg);color:var(--red);}.bblue{background:var(--blue-bg);color:var(--blue);}.bgray{background:var(--g100);color:var(--g500);}.bnavy{background:#E8EFF8;color:var(--navy);}.bpurple{background:#EEEDFE;color:#534AB7;}.btn{padding:0 14px;height:30px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--font);font-weight:500;border:none;transition:all .12s;}.btn-n{background:var(--navy);color:#fff;}.btn-g{background:var(--white);color:var(--g500);border:1px solid var(--g200);}.btn-sm{padding:0 10px;height:26px;font-size:11px;}.qbar{background:var(--white);border:1px solid var(--g100);border-radius:10px;padding:11px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}.qf{display:flex;flex-direction:column;gap:3px;}.qf label{font-size:11px;color:var(--g400);font-weight:500;}.qf select,.qf input{height:30px;border:1px solid var(--g200);border-radius:5px;padding:0 9px;font-size:12px;color:var(--dark);background:var(--white);font-family:var(--font);outline:none;}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}.kc{background:var(--white);border:1px solid var(--g100);border-radius:10px;padding:12px 14px;}.kn{font-size:22px;font-weight:700;margin:4px 0;}.kl{font-size:11px;color:var(--g400);}</style>

<script>
var ros=[

</script>
