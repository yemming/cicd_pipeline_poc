# ============================================================
# CI：新手第一個 workflow — 每次 push / PR 自動跑 lint + build
#
# 為什麼存在：
#   在 merge 進 main 之前先確認 code 沒壞。PR 頁面會出現綠勾勾 ✅
#   或紅叉叉 ❌，一眼看出這包改動能不能上 production。
#
# 不需要任何 secrets，push 完就會跑。
# ============================================================

name: CI

# ── 什麼時候觸發？─────────────────────────────────────────
# 1. push 到 main：main 被動到時跑一次（通常是 merge 之後）
# 2. pull_request：任何開到 main 的 PR，一有新 commit 就跑
# 只改文件（docs/ 或 *.md）不觸發 CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# 同一個 branch / PR 有新 push 時，取消還在跑的舊 run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1：Secret Scanning（防止新 secret 進 repo）────────
  # 用 gitleaks CLI 只掃本次 push/PR 的 commits（不掃 git 歷史）
  # 歷史裡有舊 key 沒關係，但新 push 的 commits 必須乾淨
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整 history，gitleaks 才能用 --log-opts 掃 commit range

      - name: 安裝 Gitleaks CLI
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: 掃描本次 commit（PR 用 base..head，push 用 before..after）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR：掃 base branch 到 PR head 之間的 commits
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "🔍 Scanning PR commits: $BASE..$HEAD"
            gitleaks detect --log-opts="$BASE..$HEAD" --verbose --no-git
          else
            # Push to main：掃這次 push 的 commits（before..after）
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            echo "🔍 Scanning push commits: $BEFORE..$AFTER"
            # 若 before 是 0000000（新 branch 第一次 push），改掃最近 1 commit
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              gitleaks detect --log-opts="-1" --verbose --no-git
            else
              gitleaks detect --log-opts="$BEFORE..$AFTER" --verbose --no-git
            fi
          fi

  # ── Job 2：Lint（程式碼風格檢查）─────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci（用 lockfile 安裝，比 npm install 快且穩）
        run: npm ci --prefer-offline

      - name: 跑 ESLint
        run: npm run lint

  # ── Job 3：Build（確認 Next.js 能編得出 production bundle）──
  # 跟 secret-scan / lint 平行跑（不相依，三台 VM 同時開工）
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci
        run: npm ci --prefer-offline

      - name: next build
        run: npm run build
        env:
          # GitHub runner ~7GB RAM;Next build + TS 型別檢查易 OOM,拉高 Node heap
          NODE_OPTIONS: "--max-old-space-size=6144"
          # Next.js 16 build 時若需要 env，可在這裡補。
          # 目前 public env 都在 .env（不會進 repo），build 期間不連 Supabase 也能過。
          NEXT_TELEMETRY_DISABLED: "1"
